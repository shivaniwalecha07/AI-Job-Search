# Local Postgres + pgvector. Cloud-ready: same image runs on a managed host.
# Requires Docker. If you don't have Docker, install Postgres 16 + pgvector natively
# and point DATABASE_URL at it (see README).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
